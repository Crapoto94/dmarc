services:
  backend:
    build: ./backend
    ports:
      - "3201:3201"
    volumes:
      - ./backend/data:/app/data
      - ./backend/reports:/app/reports
      - ../:/external/reports:ro
    environment:
      - PORT=3201
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3200:3200"
    depends_on:
      - backend
    restart: unless-stopped
